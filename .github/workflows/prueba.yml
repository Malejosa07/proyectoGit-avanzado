name: Prueba de token local

on: push

permissions: {}

jobs:
  comparar:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Comparar secreto con variable local
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          Write-Output "Runner: $env:RUNNER_NAME"

          if ([string]::IsNullOrEmpty($env:DEV_TOKEN) -or
              [string]::IsNullOrEmpty($env:LOCAL_DEV_TOKEN)) {
            Write-Output "ERROR: falta el secreto o la variable local."
            exit 1
          }

          if ($env:DEV_TOKEN -ceq $env:LOCAL_DEV_TOKEN) {
            Write-Output "CORRECTO: los tokens coinciden."
            exit 0
          } else {
            Write-Output "ERROR: los tokens no coinciden."
            exit 1
          }
